<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VIGIL</title>
<style>
  :root {
    --ink: #f2ead8;
    --ink-dim: #a89a7b;
    --gold: #d9a95c;
    --gold-soft: rgba(217, 169, 92, 0.22);
    --wall: #1a1610;
    --floor: #0d0b08;
    --frame: #2a1f14;
    --frame-hi: #4a3720;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #14100a 0%, #000 100%);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    touch-action: none;
  }
  #back-btn {
    position: fixed;
    top: 0.75rem;
    left: 0.75rem;
    z-index: 9998;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    font-family: system-ui, sans-serif;
  }
  #back-btn:hover { background: rgba(0,0,0,0.75); }
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    background: radial-gradient(ellipse at center, #14100a 0%, #000 100%);
    color: var(--ink);
    z-index: 100;
    gap: 1.2rem;
    animation: fade 0.6s ease;
  }
  .screen.hidden { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: clamp(3rem, 12vw, 6rem);
    letter-spacing: 0.4em;
    padding-left: 0.4em;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(217, 169, 92, 0.4);
  }
  h2 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    color: var(--gold);
  }
  .subtitle {
    font-style: italic;
    color: var(--ink-dim);
    font-size: clamp(0.95rem, 3.6vw, 1.3rem);
    max-width: 32em;
    line-height: 1.6;
  }
  .instr {
    color: var(--ink);
    font-size: clamp(0.9rem, 3.2vw, 1.15rem);
    max-width: 30em;
    line-height: 1.7;
    opacity: 0.85;
  }
  .instr em { color: var(--gold); font-style: normal; }
  button {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    letter-spacing: 0.3em;
    padding: 0.9em 2.2em 0.9em 2.5em;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    cursor: pointer;
    margin-top: 1rem;
    transition: all 0.3s ease;
  }
  button:hover, button:active {
    background: var(--gold-soft);
    box-shadow: 0 0 25px rgba(217, 169, 92, 0.3);
  }
  #memories {
    max-height: 40vh;
    overflow-y: auto;
    padding: 0 1rem;
    color: var(--ink-dim);
    font-style: italic;
    line-height: 1.7;
    font-size: clamp(0.9rem, 3vw, 1.1rem);
  }
  #memories .m {
    margin: 0.6em 0;
    opacity: 0.85;
  }
  #memories .m::before { content: "— "; color: var(--gold); }
  .lost {
    color: #c94a3a;
    font-style: italic;
    margin-top: 1rem;
    font-size: clamp(1rem, 3.4vw, 1.25rem);
  }
</style>

<a id="back-btn" href="../../index.html">← Games</a>

<div id="stage">
  <canvas id="c"></canvas>
</div>

<div id="title-screen" class="screen">
  <h1>VIGIL</h1>
  <div class="subtitle">
    You are the night guard.<br>
    The gallery is quiet, but the paintings need to be looked at.
  </div>
  <div class="instr">
    Tap anywhere along the wall to send your gaze.<br>
    Attention keeps a painting <em>safe</em> — and reveals what only you will ever know about it.
  </div>
  <button id="start-btn">BEGIN SHIFT</button>
</div>

<div id="end-screen" class="screen hidden">
  <h2 id="end-title">DAWN</h2>
  <div class="subtitle" id="end-sub"></div>
  <div id="memories"></div>
  <button id="restart-btn">ANOTHER NIGHT</button>
</div>

<script>
const ORIENTATION = 'LANDSCAPE';

function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  const wrong = (ORIENTATION === 'PORTRAIT' && !isPortrait) ||
                (ORIENTATION === 'LANDSCAPE' && isPortrait);

  let overlay = document.getElementById('orientation-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'orientation-overlay';
    overlay.style.cssText = `
      display:none; position:fixed; inset:0; z-index:9999;
      background:#000; color:#fff; flex-direction:column;
      align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2rem; text-align:center; gap:1rem;
    `;
    overlay.innerHTML = `
      <div style="font-size:3rem">📱</div>
      <div>Please rotate your device</div>
      <div style="font-size:0.85rem;opacity:0.6;">${ORIENTATION === 'PORTRAIT' ? 'This game is best played upright' : 'This game is best played sideways'}</div>
    `;
    document.body.appendChild(overlay);
  }
  overlay.style.display = wrong ? 'flex' : 'none';
}
window.addEventListener('resize', checkOrientation);
checkOrientation();

async function tryLockOrientation() {
  try {
    await document.documentElement.requestFullscreen?.();
    await screen.orientation?.lock?.(
      ORIENTATION === 'PORTRAIT' ? 'portrait' : 'landscape'
    );
  } catch (_) {}
}
document.addEventListener('pointerdown', tryLockOrientation, { once: true });

// ---------- PAINTING CATALOGUE ----------
// Each painting has a name, a memory (only you know), a color palette, and a subject type.
const CATALOG = [
  { name: "The Widow's Locket",  year: 1847, memory: "She was not looking at the painter. The letter in her hand had already been read.", palette: ["#3d2f22","#8a5a3a","#c9a678","#f3e6c8"], subject: "figure" },
  { name: "Field After Rain",     year: 1892, memory: "The horizon here is one brushstroke. It is the last painting he made with his right hand.", palette: ["#2a3628","#5a7050","#a0b088","#e0d8b8"], subject: "landscape" },
  { name: "A Girl and a Pear",    year: 1811, memory: "The pear was rotten by the time it was finished. She refused to eat it afterward.", palette: ["#3a2018","#7a3820","#c8905c","#f0e0c0"], subject: "still" },
  { name: "Study of Blue",        year: 1904, memory: "There is a small dog in the lower left. Nobody has ever mentioned it aloud.", palette: ["#0d2038","#2a5080","#78a8c8","#e0e8f0"], subject: "abstract" },
  { name: "The Empty Chair",      year: 1863, memory: "He painted it every morning for a year, waiting. The seat is worn only where his wife sat.", palette: ["#20180f","#5c3f26","#8a6b48","#c8b088"], subject: "still" },
  { name: "Two Sisters, Silent",  year: 1878, memory: "The elder's hand is loose. They had not spoken in six months when this was sat for.", palette: ["#2c1a20","#6a3848","#b07890","#f0d8c8"], subject: "figure" },
  { name: "The Frost Orchard",    year: 1888, memory: "There are footprints in the snow. Only one direction. Nobody comes back.", palette: ["#1a1a26","#3a4a5c","#88a0b8","#e8ecf0"], subject: "landscape" },
  { name: "Interior with Lamp",   year: 1921, memory: "The lamp is lit. It is noon. She insisted.", palette: ["#1c1408","#5a3c1a","#b08840","#f0d888"], subject: "still" },
  { name: "The Musician's Wife",  year: 1854, memory: "She is holding sheet music upside down. She could not read it. He did not correct her.", palette: ["#2a1a1a","#6a3838","#a87050","#e8c898"], subject: "figure" },
  { name: "Cliffs at Evening",    year: 1866, memory: "The gulls in the sky are the same gull, painted six times as it circled.", palette: ["#1a1420","#3a3050","#786080","#e0c8b8"], subject: "landscape" },
  { name: "Fruit and Knife",      year: 1795, memory: "The knife points at the viewer. No one has ever noticed. It was placed there for one specific person, long dead.", palette: ["#28180f","#6a3820","#b07038","#e8c078"], subject: "still" },
  { name: "The Boy Who Waited",   year: 1902, memory: "He is looking past the frame. Nothing was ever painted there.", palette: ["#181820","#3a3a4a","#78788a","#c8c8d0"], subject: "figure" },
];

// ---------- GAME STATE ----------
let canvas, ctx, W, H;
const state = {
  running: false,
  paintings: [],
  visitors: [],
  gaze: { x: 0.5, y: 0.55, targetX: 0.5, r: 0 },
  guard: { x: 0.5, targetX: 0.5 },
  time: 0,
  duration: 100, // seconds
  startedAt: 0,
  lastSpawn: 0,
  particles: [],
  memoriesUnlocked: new Set(),
  paintingsLost: [],
  message: null,
  messageT: 0,
  thiefStrike: null,
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = w; H = h;
}

function init() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', () => { resize(); layoutPaintings(); });
  canvas.addEventListener('pointerdown', onPointer);
  canvas.addEventListener('pointermove', onPointerMove);
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);
  requestAnimationFrame(loop);
}

let pointerHeld = false;
function onPointer(e) {
  if (!state.running) return;
  pointerHeld = true;
  const rect = canvas.getBoundingClientRect();
  aimGaze((e.clientX - rect.left) / rect.width, (e.clientY - rect.top) / rect.height);
}
function onPointerMove(e) {
  if (!state.running || !pointerHeld) return;
  const rect = canvas.getBoundingClientRect();
  aimGaze((e.clientX - rect.left) / rect.width, (e.clientY - rect.top) / rect.height);
}
window.addEventListener('pointerup', () => pointerHeld = false);
window.addEventListener('pointercancel', () => pointerHeld = false);

function aimGaze(nx, ny) {
  state.gaze.targetX = clamp(nx, 0.05, 0.95);
  state.guard.targetX = state.gaze.targetX;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }

// ---------- START GAME ----------
function startGame() {
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('end-screen').classList.add('hidden');
  state.running = true;
  state.time = 0;
  state.startedAt = performance.now();
  state.lastSpawn = 0;
  state.visitors = [];
  state.particles = [];
  state.memoriesUnlocked = new Set();
  state.paintingsLost = [];
  state.thiefStrike = null;
  state.message = null;
  state.gaze.x = 0.5; state.gaze.targetX = 0.5;
  state.guard.x = 0.5; state.guard.targetX = 0.5;
  layoutPaintings();
}

function layoutPaintings() {
  // Choose 5 paintings from catalog
  const shuffled = [...CATALOG].sort(() => Math.random() - 0.5);
  const chosen = shuffled.slice(0, 5);
  const n = chosen.length;
  const margin = 0.09;
  const usable = 1 - margin * 2;
  state.paintings = chosen.map((p, i) => {
    const cx = margin + usable * ((i + 0.5) / n);
    const isBig = Math.random() < 0.35;
    return {
      ...p,
      cx,
      cy: 0.32,
      wFrac: isBig ? 0.13 : 0.10,
      hFrac: isBig ? 0.34 : 0.28,
      attention: 0.35, // 0..1, decays
      unlocked: false,
      pulse: 0,
      stolen: false,
      dangerRing: 0,
    };
  });
}

// ---------- VISITOR SPAWNING ----------
function spawnVisitor(forceThief) {
  // Visitors enter from either side and drift along the floor.
  const fromLeft = Math.random() < 0.5;
  const targetPainting = state.paintings[randi(0, state.paintings.length - 1)];
  const isThief = forceThief || (state.visitors.every(v => !v.isThief) && Math.random() < 0.55);
  state.visitors.push({
    x: fromLeft ? -0.05 : 1.05,
    dir: fromLeft ? 1 : -1,
    y: 0.72 + rand(-0.02, 0.02),
    speed: rand(0.018, 0.032),
    target: targetPainting,
    isThief,
    state: 'walking', // walking, approaching, viewing, reaching, fleeing
    stateT: 0,
    reachT: 0,             // how long they've been reaching
    reachNeeded: 3.5,      // seconds of unwatched contact needed
    fidget: 0,
    tookPainting: false,
    life: 0,
    id: Math.random(),
    height: rand(0.15, 0.20),
  });
}

// ---------- MAIN LOOP ----------
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;

  ctx.clearRect(0, 0, W, H);
  drawRoom();

  if (state.running) update(dt);

  drawPaintings();
  drawGaze();
  drawVisitors();
  drawGuard();
  drawParticles();
  drawHUD();

  requestAnimationFrame(loop);
}

function update(dt) {
  state.time += dt;

  // Smooth gaze / guard motion
  state.gaze.x = lerp(state.gaze.x, state.gaze.targetX, 0.14);
  state.guard.x = lerp(state.guard.x, state.guard.targetX, 0.09);
  state.gaze.r = lerp(state.gaze.r, 0.11, 0.1);

  // Paintings: attention update
  const gazePower = 0.9;
  for (const p of state.paintings) {
    if (p.stolen) continue;
    // Attention increases if painting is inside gaze cone
    const dx = Math.abs(p.cx - state.gaze.x);
    const inCone = dx < state.gaze.r * 1.2;
    if (inCone) {
      // Closer to center → stronger
      const proximity = 1 - (dx / (state.gaze.r * 1.2));
      p.attention = Math.min(1, p.attention + dt * gazePower * (0.4 + 0.6 * proximity));
      if (p.attention > 0.85 && !p.unlocked) {
        p.unlocked = true;
        state.memoriesUnlocked.add(p.name);
        p.pulse = 1;
        showMessage(p.name.toUpperCase());
        addSparkles(p);
      }
    } else {
      p.attention = Math.max(0, p.attention - dt * 0.09);
    }
    // Danger ring visual
    p.dangerRing = Math.max(0, p.dangerRing - dt * 1.5);
    if (p.pulse > 0) p.pulse = Math.max(0, p.pulse - dt * 0.5);
  }

  // Visitor spawning
  const spawnGap = Math.max(3.5, 6.5 - state.time * 0.03);
  if (state.time - state.lastSpawn > spawnGap && state.visitors.length < 4) {
    state.lastSpawn = state.time;
    spawnVisitor(false);
  }
  // Guarantee at least one thief mid-shift
  if (state.time > 12 && !state.visitors.some(v => v.isThief) && !state.thiefStrike) {
    // Occasional force
    if (Math.random() < dt * 0.35) spawnVisitor(true);
  }

  // Update visitors
  for (const v of state.visitors) {
    v.life += dt;
    v.stateT += dt;
    if (v.state === 'walking') {
      v.x += v.speed * v.dir * dt * 4;
      const targetX = v.target.cx;
      // Approach painting when close in x
      if (Math.abs(v.x - targetX) < 0.02) {
        v.state = 'approaching';
        v.stateT = 0;
      }
      if ((v.dir > 0 && v.x > 1.1) || (v.dir < 0 && v.x < -0.1)) v.dead = true;
    } else if (v.state === 'approaching') {
      // Move up toward the painting
      v.y = lerp(v.y, 0.62, 0.05);
      if (v.stateT > 1.2) {
        v.state = v.isThief ? 'reaching' : 'viewing';
        v.stateT = 0;
      }
    } else if (v.state === 'viewing') {
      // Look at painting briefly
      if (v.stateT > rand(2, 4)) {
        v.state = 'leaving';
        v.stateT = 0;
      }
    } else if (v.state === 'reaching') {
      // Only progresses when painting is unwatched
      const p = v.target;
      const dx = Math.abs(p.cx - state.gaze.x);
      const watched = dx < state.gaze.r * 1.35;
      v.fidget = watched ? 0.15 : Math.min(1, v.fidget + dt * 0.8);
      if (watched) {
        // Retreat slightly
        v.reachT = Math.max(0, v.reachT - dt * 2.0);
        v.y = lerp(v.y, 0.66, 0.05);
        p.dangerRing = Math.max(p.dangerRing, 0.4);
      } else {
        v.reachT += dt;
        v.y = lerp(v.y, 0.56, 0.03);
        p.dangerRing = Math.max(p.dangerRing, 0.9);
      }
      if (v.reachT >= v.reachNeeded && !v.tookPainting) {
        // STEAL
        v.tookPainting = true;
        p.stolen = true;
        state.paintingsLost.push(p);
        v.state = 'fleeing';
        v.stateT = 0;
        state.thiefStrike = { at: state.time, painting: p };
        addBreakParticles(p);
      }
    } else if (v.state === 'leaving' || v.state === 'fleeing') {
      v.y = lerp(v.y, 0.75, 0.05);
      v.x += v.speed * v.dir * dt * (v.state === 'fleeing' ? 10 : 4);
      if ((v.dir > 0 && v.x > 1.1) || (v.dir < 0 && v.x < -0.1)) v.dead = true;
    }
  }
  state.visitors = state.visitors.filter(v => !v.dead);

  // Particles
  for (const p of state.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.g * dt;
    p.life -= dt;
  }
  state.particles = state.particles.filter(p => p.life > 0);

  // Message fade
  if (state.message) {
    state.messageT += dt;
    if (state.messageT > 2.6) state.message = null;
  }

  // Check end conditions
  if (state.paintingsLost.length >= 2) {
    endGame(false);
  } else if (state.time >= state.duration) {
    endGame(true);
  }
}

function showMessage(msg) {
  state.message = msg;
  state.messageT = 0;
}

function addSparkles(p) {
  const cx = p.cx * W;
  const cy = p.cy * H;
  const w = p.wFrac * W;
  const h = p.hFrac * H;
  for (let i = 0; i < 24; i++) {
    state.particles.push({
      x: cx + rand(-w*0.4, w*0.4),
      y: cy + rand(-h*0.4, h*0.4),
      vx: rand(-30, 30),
      vy: rand(-60, -10),
      g: 40,
      life: rand(0.6, 1.4),
      maxLife: 1.4,
      color: 'rgba(217, 169, 92, 0.9)',
      size: rand(1, 2.5),
    });
  }
}

function addBreakParticles(p) {
  const cx = p.cx * W;
  const cy = p.cy * H;
  const w = p.wFrac * W;
  const h = p.hFrac * H;
  for (let i = 0; i < 40; i++) {
    state.particles.push({
      x: cx + rand(-w*0.5, w*0.5),
      y: cy + rand(-h*0.5, h*0.5),
      vx: rand(-160, 160),
      vy: rand(-160, 40),
      g: 400,
      life: rand(0.7, 1.6),
      maxLife: 1.6,
      color: 'rgba(201, 74, 58, 0.8)',
      size: rand(1.5, 3.5),
    });
  }
}

// ---------- DRAWING ----------
function drawRoom() {
  // Wall with subtle vignette
  const wallH = H * 0.68;
  ctx.fillStyle = '#1a1610';
  ctx.fillRect(0, 0, W, wallH);
  // Wallpaper pattern hint
  const g = ctx.createLinearGradient(0, 0, 0, wallH);
  g.addColorStop(0, 'rgba(20, 15, 8, 0.7)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, wallH);
  // Floor
  ctx.fillStyle = '#0a0806';
  ctx.fillRect(0, wallH, W, H - wallH);
  // Baseboard
  ctx.fillStyle = '#2a1f14';
  ctx.fillRect(0, wallH - 6, W, 10);
  ctx.fillStyle = '#4a3720';
  ctx.fillRect(0, wallH - 6, W, 2);
  // Floor reflection gradient
  const fg = ctx.createLinearGradient(0, wallH, 0, H);
  fg.addColorStop(0, 'rgba(80, 60, 30, 0.15)');
  fg.addColorStop(0.6, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, wallH, W, H - wallH);

  // Global vignette
  const vg = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawGaze() {
  if (!state.running) return;
  const cx = state.gaze.x * W;
  const cy = state.gaze.y * H;
  const r = state.gaze.r * W;
  // Soft golden aura
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, 'rgba(217, 169, 92, 0.28)');
  grad.addColorStop(0.5, 'rgba(217, 169, 92, 0.12)');
  grad.addColorStop(1, 'rgba(217, 169, 92, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  // Fine ring
  ctx.strokeStyle = 'rgba(217, 169, 92, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPaintings() {
  for (const p of state.paintings) {
    const cx = p.cx * W;
    const cy = p.cy * H;
    const w = p.wFrac * W;
    const h = p.hFrac * H;
    const x = cx - w / 2, y = cy - h / 2;

    if (p.stolen) {
      // Empty frame silhouette + hook
      ctx.strokeStyle = 'rgba(60, 40, 24, 0.6)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
      // Hook
      ctx.fillStyle = 'rgba(90, 70, 40, 0.6)';
      ctx.fillRect(cx - 2, y - 8, 4, 6);
      continue;
    }

    // Frame with warmth based on attention
    const warmth = p.attention;
    const frameCol = `rgb(${42 + warmth * 60}, ${31 + warmth * 40}, ${20 + warmth * 20})`;
    ctx.fillStyle = frameCol;
    const fW = w + 12, fH = h + 12;
    ctx.fillRect(cx - fW/2, cy - fH/2, fW, fH);
    // Inner frame line
    ctx.strokeStyle = `rgba(${180 + warmth*60}, ${140 + warmth*50}, ${80 + warmth*40}, ${0.4 + warmth * 0.5})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(cx - fW/2 + 3, cy - fH/2 + 3, fW - 6, fH - 6);

    // Painting content
    drawPaintingContent(p, x, y, w, h, warmth);

    // Attention pulse when unlocked
    if (p.pulse > 0) {
      ctx.strokeStyle = `rgba(217, 169, 92, ${p.pulse * 0.6})`;
      ctx.lineWidth = 2 + p.pulse * 4;
      const grow = (1 - p.pulse) * 30;
      ctx.strokeRect(cx - fW/2 - grow/2, cy - fH/2 - grow/2, fW + grow, fH + grow);
    }

    // Danger ring (red pulse)
    if (p.dangerRing > 0) {
      const dr = p.dangerRing;
      ctx.strokeStyle = `rgba(201, 74, 58, ${dr * 0.7})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(cx - fW/2 - 4, cy - fH/2 - 4, fW + 8, fH + 8);
    }

    // Little unlocked mark
    if (p.unlocked) {
      ctx.fillStyle = 'rgba(217, 169, 92, 0.9)';
      ctx.beginPath();
      ctx.arc(cx + fW/2 - 6, cy + fH/2 - 6, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPaintingContent(p, x, y, w, h, warmth) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();

  const [c1, c2, c3, c4] = p.palette;
  // Dim if not attended, warm if attended
  const dim = 0.35 + warmth * 0.65;

  if (p.subject === 'landscape') {
    // Sky gradient
    const sky = ctx.createLinearGradient(x, y, x, y + h * 0.6);
    sky.addColorStop(0, applyDim(c4, dim));
    sky.addColorStop(1, applyDim(c3, dim));
    ctx.fillStyle = sky;
    ctx.fillRect(x, y, w, h * 0.6);
    // Ground
    ctx.fillStyle = applyDim(c2, dim);
    ctx.fillRect(x, y + h * 0.6, w, h * 0.4);
    // Horizon detail
    ctx.fillStyle = applyDim(c1, dim);
    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.6);
    ctx.lineTo(x + w * 0.3, y + h * 0.55);
    ctx.lineTo(x + w * 0.6, y + h * 0.62);
    ctx.lineTo(x + w, y + h * 0.58);
    ctx.lineTo(x + w, y + h * 0.6);
    ctx.closePath();
    ctx.fill();
  } else if (p.subject === 'figure') {
    // Background
    ctx.fillStyle = applyDim(c1, dim);
    ctx.fillRect(x, y, w, h);
    // Body
    ctx.fillStyle = applyDim(c2, dim);
    ctx.beginPath();
    ctx.moveTo(x + w * 0.5, y + h * 0.35);
    ctx.bezierCurveTo(x + w * 0.15, y + h * 0.55, x + w * 0.15, y + h, x + w * 0.85, y + h);
    ctx.bezierCurveTo(x + w * 0.85, y + h * 0.55, x + w * 0.85, y + h * 0.55, x + w * 0.5, y + h * 0.35);
    ctx.fill();
    // Head
    ctx.fillStyle = applyDim(c3, dim);
    ctx.beginPath();
    ctx.arc(x + w * 0.5, y + h * 0.28, w * 0.16, 0, Math.PI * 2);
    ctx.fill();
    // Highlight
    ctx.fillStyle = applyDim(c4, dim * 0.9);
    ctx.beginPath();
    ctx.arc(x + w * 0.44, y + h * 0.26, w * 0.05, 0, Math.PI * 2);
    ctx.fill();
  } else if (p.subject === 'still') {
    // Table plane
    ctx.fillStyle = applyDim(c1, dim);
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = applyDim(c2, dim);
    ctx.fillRect(x, y + h * 0.7, w, h * 0.3);
    // Object 1 (pear/apple)
    ctx.fillStyle = applyDim(c3, dim);
    ctx.beginPath();
    ctx.ellipse(x + w * 0.4, y + h * 0.6, w * 0.12, h * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    // Object 2 (bowl / secondary)
    ctx.fillStyle = applyDim(c4, dim);
    ctx.beginPath();
    ctx.ellipse(x + w * 0.65, y + h * 0.63, w * 0.15, h * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();
  } else { // abstract
    ctx.fillStyle = applyDim(c1, dim);
    ctx.fillRect(x, y, w, h);
    // Bands
    ctx.fillStyle = applyDim(c2, dim);
    ctx.fillRect(x, y + h * 0.3, w, h * 0.15);
    ctx.fillStyle = applyDim(c3, dim);
    ctx.fillRect(x, y + h * 0.55, w, h * 0.2);
    ctx.fillStyle = applyDim(c4, dim * 0.9);
    ctx.beginPath();
    ctx.arc(x + w * 0.7, y + h * 0.3, w * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function applyDim(hex, dim) {
  // hex like "#rrggbb"
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgb(${Math.round(r*dim)}, ${Math.round(g*dim)}, ${Math.round(b*dim)})`;
}

function drawVisitors() {
  for (const v of state.visitors) {
    const px = v.x * W;
    const py = v.y * H;
    const hgt = v.height * H;
    const wid = hgt * 0.35;

    // Fidget offset for thief when unwatched
    const fx = v.fidget > 0 ? Math.sin(v.life * 30) * v.fidget * 2 : 0;

    // Body silhouette
    ctx.fillStyle = v.isThief && v.state === 'reaching' ? 'rgba(20, 10, 10, 0.92)' : 'rgba(15, 12, 10, 0.9)';
    // Legs area (thin)
    ctx.beginPath();
    ctx.moveTo(px - wid * 0.5 + fx, py + hgt * 0.15);
    ctx.lineTo(px + wid * 0.5 + fx, py + hgt * 0.15);
    ctx.lineTo(px + wid * 0.35 + fx, py + hgt * 0.5);
    ctx.lineTo(px - wid * 0.35 + fx, py + hgt * 0.5);
    ctx.closePath();
    ctx.fill();
    // Torso
    ctx.beginPath();
    ctx.moveTo(px - wid * 0.55 + fx, py - hgt * 0.15);
    ctx.lineTo(px + wid * 0.55 + fx, py - hgt * 0.15);
    ctx.lineTo(px + wid * 0.5 + fx, py + hgt * 0.2);
    ctx.lineTo(px - wid * 0.5 + fx, py + hgt * 0.2);
    ctx.closePath();
    ctx.fill();
    // Head
    ctx.beginPath();
    ctx.arc(px + fx, py - hgt * 0.28, wid * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Reaching arm (thief)
    if (v.state === 'reaching') {
      const p = v.target;
      const armReach = Math.min(1, v.reachT / v.reachNeeded);
      ctx.strokeStyle = 'rgba(15, 12, 10, 0.85)';
      ctx.lineWidth = wid * 0.28;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const armStartY = py - hgt * 0.15;
      const armEndY = lerp(armStartY, p.cy * H + p.hFrac * H * 0.35, 0.5 + armReach * 0.4);
      ctx.moveTo(px + fx, armStartY);
      ctx.lineTo(px + fx, armEndY);
      ctx.stroke();
      // Tension shake dots
      if (armReach > 0.3) {
        ctx.fillStyle = `rgba(201, 74, 58, ${armReach * 0.5})`;
        ctx.beginPath();
        ctx.arc(px + fx, armEndY, wid * 0.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Reflection on floor
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.scale(1, -0.4);
    ctx.fillStyle = 'rgba(15, 12, 10, 1)';
    ctx.beginPath();
    ctx.ellipse(px, -(py + hgt * 0.5) * 2.5, wid * 0.4, hgt * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawGuard() {
  if (!state.running) return;
  // Small silhouette near bottom center, sliding to guard.x
  const gx = state.guard.x * W;
  const gy = H * 0.86;
  const hgt = H * 0.14;
  const wid = hgt * 0.35;
  // Simple silhouette
  ctx.fillStyle = 'rgba(10, 8, 6, 0.95)';
  // Body
  ctx.beginPath();
  ctx.moveTo(gx - wid * 0.55, gy - hgt * 0.15);
  ctx.lineTo(gx + wid * 0.55, gy - hgt * 0.15);
  ctx.lineTo(gx + wid * 0.5, gy + hgt * 0.4);
  ctx.lineTo(gx - wid * 0.5, gy + hgt * 0.4);
  ctx.closePath();
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.arc(gx, gy - hgt * 0.28, wid * 0.35, 0, Math.PI * 2);
  ctx.fill();
  // Cap
  ctx.fillStyle = 'rgba(30, 24, 15, 1)';
  ctx.beginPath();
  ctx.arc(gx, gy - hgt * 0.32, wid * 0.38, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(gx - wid * 0.45, gy - hgt * 0.31, wid * 0.9, 3);
}

function drawParticles() {
  for (const p of state.particles) {
    const a = Math.max(0, Math.min(1, p.life / p.maxLife));
    ctx.fillStyle = p.color.replace(/[\d.]+\)$/, `${a})`);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHUD() {
  if (!state.running) return;
  // Time bar (top-right, discreet)
  const barW = W * 0.28;
  const barH = 3;
  const bx = W - barW - 20;
  const by = 20;
  ctx.fillStyle = 'rgba(80, 60, 30, 0.3)';
  ctx.fillRect(bx, by, barW, barH);
  const progress = Math.min(1, state.time / state.duration);
  ctx.fillStyle = 'rgba(217, 169, 92, 0.85)';
  ctx.fillRect(bx, by, barW * progress, barH);

  // Time label
  ctx.font = "300 11px 'Cormorant Garamond', Georgia, serif";
  ctx.fillStyle = 'rgba(217, 169, 92, 0.7)';
  ctx.textAlign = 'right';
  const remaining = Math.max(0, state.duration - state.time);
  const label = state.time < 20 ? "DUSK" : state.time < 50 ? "MIDNIGHT" : state.time < 80 ? "DEEP HOURS" : "TOWARD DAWN";
  ctx.fillText(label, W - 20, 12);

  // Attention overlay: little dots per painting
  ctx.textAlign = 'left';
  for (const p of state.paintings) {
    if (p.stolen) continue;
    const cx = p.cx * W;
    const dotY = p.cy * H + p.hFrac * H / 2 + 24;
    // 4 pips
    for (let i = 0; i < 4; i++) {
      const filled = p.attention > (i + 1) / 4 * 0.9;
      ctx.fillStyle = filled ? 'rgba(217, 169, 92, 0.85)' : 'rgba(80, 60, 30, 0.3)';
      ctx.beginPath();
      ctx.arc(cx - 12 + i * 8, dotY, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // Name if unlocked
    if (p.unlocked) {
      ctx.font = "italic 300 12px 'Cormorant Garamond', Georgia, serif";
      ctx.fillStyle = 'rgba(217, 169, 92, 0.75)';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, cx, dotY + 16);
    }
  }
  ctx.textAlign = 'left';

  // Message
  if (state.message) {
    const t = state.messageT;
    let a = 1;
    if (t < 0.3) a = t / 0.3;
    else if (t > 2.0) a = Math.max(0, 1 - (t - 2.0) / 0.6);
    ctx.font = "300 20px 'Cormorant Garamond', Georgia, serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(217, 169, 92, ${a})`;
    ctx.fillText(state.message, W / 2, H * 0.94);
    // Underline flourish
    const tw = ctx.measureText(state.message).width;
    ctx.strokeStyle = `rgba(217, 169, 92, ${a * 0.5})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(W/2 - tw/2 - 20, H * 0.955);
    ctx.lineTo(W/2 + tw/2 + 20, H * 0.955);
    ctx.stroke();
  }

  // Lost count (subtle)
  if (state.paintingsLost.length > 0) {
    ctx.font = "italic 300 12px 'Cormorant Garamond', Georgia, serif";
    ctx.fillStyle = 'rgba(201, 74, 58, 0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(`Lost: ${state.paintingsLost.length}`, 20, H - 20);
  }
}

// ---------- END GAME ----------
function endGame(survived) {
  state.running = false;
  const endScreen = document.getElementById('end-screen');
  const title = document.getElementById('end-title');
  const sub = document.getElementById('end-sub');
  const mems = document.getElementById('memories');

  const kept = state.paintings.filter(p => !p.stolen);
  const learned = state.paintings.filter(p => p.unlocked && !p.stolen);
  const lost = state.paintingsLost;

  if (!survived) {
    title.textContent = 'DAWN, DIMINISHED';
    sub.innerHTML = `Two paintings are gone from your walls. The morning shift will not know how they hung.`;
  } else if (lost.length === 0 && learned.length >= 3) {
    title.textContent = 'DAWN, WHOLE';
    sub.innerHTML = `All the paintings are here. You know some of them a little better than yesterday.`;
  } else if (lost.length === 0) {
    title.textContent = 'DAWN';
    sub.innerHTML = `The paintings are all where you left them. Nobody will notice.`;
  } else {
    title.textContent = 'DAWN, MOSTLY';
    sub.innerHTML = `One painting is missing. Somewhere it is being unpacked.`;
  }

  mems.innerHTML = '';
  if (learned.length > 0) {
    const label = document.createElement('div');
    label.style.marginBottom = '0.8em';
    label.style.color = 'var(--gold)';
    label.style.letterSpacing = '0.15em';
    label.style.fontSize = '0.9em';
    label.textContent = 'WHAT ONLY YOU KNOW';
    mems.appendChild(label);
    for (const p of learned) {
      const div = document.createElement('div');
      div.className = 'm';
      div.innerHTML = `<b style="color:var(--ink);font-weight:normal;">${p.name}</b> <span style="opacity:0.6;">(${p.year})</span> — ${p.memory}`;
      mems.appendChild(div);
    }
  }
  if (lost.length > 0) {
    const label = document.createElement('div');
    label.style.margin = '1.2em 0 0.6em';
    label.style.color = '#c94a3a';
    label.style.letterSpacing = '0.15em';
    label.style.fontSize = '0.9em';
    label.textContent = 'GONE';
    mems.appendChild(label);
    for (const p of lost) {
      const div = document.createElement('div');
      div.className = 'm';
      div.style.color = '#c94a3a';
      div.style.opacity = '0.7';
      div.innerHTML = `<b style="font-weight:normal;">${p.name}</b> <span style="opacity:0.7;">(${p.year})</span>`;
      mems.appendChild(div);
    }
  }
  if (learned.length === 0 && lost.length === 0) {
    const div = document.createElement('div');
    div.className = 'm';
    div.style.textAlign = 'center';
    div.style.marginTop = '1em';
    div.textContent = 'You watched, but not for long enough to remember anything new.';
    mems.appendChild(div);
  }

  endScreen.classList.remove('hidden');
}

init();
</script>
